<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — ai-cli-manager CLI UX</title>
  <!-- Three CLI interaction variants, switchable via ?variant=A|B|C. Throwaway prototype. -->
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f1ea;
      --ink: #171713;
      --muted: #737167;
      --line: #d2cfc4;
      --terminal: #151613;
      --terminal-ink: #e9e8df;
      --terminal-muted: #8d9087;
      --accent: #c8ff55;
      --danger: #ff8d78;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, transparent 49.8%, rgba(23, 23, 19, .045) 50%, transparent 50.2%),
        var(--paper);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1060px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 48px 0 132px;
    }

    .eyebrow,
    .state-title {
      font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .eyebrow { color: var(--muted); }

    h1 {
      max-width: 760px;
      margin: 16px 0 10px;
      font-size: clamp(36px, 6vw, 70px);
      line-height: .96;
      letter-spacing: -.055em;
      font-weight: 620;
    }

    .lede {
      max-width: 670px;
      margin: 0 0 30px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .prototype-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 18px;
      align-items: start;
    }

    .terminal {
      min-height: 520px;
      overflow: hidden;
      color: var(--terminal-ink);
      background: var(--terminal);
      border: 1px solid #050504;
      border-radius: 15px;
      box-shadow: 0 24px 70px rgba(18, 18, 14, .2);
      font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .terminal-chrome {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 43px;
      padding: 0 16px;
      color: var(--terminal-muted);
      border-bottom: 1px solid #2d2f29;
      font-size: 11px;
    }

    .dots { letter-spacing: 4px; color: #66685f; }
    .terminal-body { padding: 25px 27px 28px; }

    .state-panel {
      position: sticky;
      top: 20px;
      min-height: 240px;
      padding: 18px;
      background: rgba(255, 255, 255, .42);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .state-title { margin-bottom: 14px; color: var(--muted); }
    .state-panel pre {
      margin: 0;
      white-space: pre-wrap;
      color: #3f3e38;
      font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .brand-row,
    .summary-row,
    .footer-row,
    .variant-topline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }

    .brand { font-weight: 760; color: #fff; }
    .muted { color: var(--terminal-muted); }
    .accent { color: var(--accent); }
    .danger { color: var(--danger); }
    .fine { font-size: 11px; }
    .section-space { height: 20px; }

    .rule {
      height: 1px;
      margin: 18px 0;
      background: #31332d;
    }

    .tool-list { display: grid; gap: 3px; }

    .tool-row,
    .action-card,
    .intent-row {
      width: 100%;
      color: inherit;
      background: transparent;
      border: 0;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .tool-row {
      display: grid;
      grid-template-columns: 22px minmax(130px, 1.2fr) minmax(95px, .8fr) minmax(90px, .75fr);
      align-items: center;
      gap: 10px;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 7px;
    }

    .tool-row:hover,
    .tool-row.selected { background: #252720; }
    .check { color: #5f6258; }
    .selected .check { color: var(--accent); }
    .action { text-align: right; color: var(--terminal-muted); }
    .selected .action { color: var(--accent); }

    .terminal-button {
      padding: 8px 12px;
      color: #11120f;
      background: var(--accent);
      border: 0;
      border-radius: 6px;
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      cursor: pointer;
    }

    .terminal-button.ghost {
      color: var(--terminal-ink);
      background: transparent;
      border: 1px solid #45483f;
    }

    .terminal-button:disabled { opacity: .35; cursor: default; }

    .action-stack { display: grid; gap: 10px; margin-top: 20px; }

    .action-card {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 13px;
      min-height: 76px;
      padding: 13px 15px;
      border: 1px solid #36382f;
      border-radius: 10px;
    }

    .action-card:hover,
    .action-card.selected { border-color: var(--accent); background: #20221c; }
    .action-glyph { color: var(--accent); font-size: 21px; text-align: center; }
    .action-copy strong { display: block; margin-bottom: 3px; color: #fff; }
    .action-copy span { color: var(--terminal-muted); font-size: 12px; }
    .action-count { color: var(--terminal-muted); }

    .current-strip {
      margin-top: 18px;
      padding: 12px 14px;
      color: var(--terminal-muted);
      background: #1d1f1a;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.8;
    }

    .question {
      margin: 30px 0 16px;
      color: #fff;
      font-size: 19px;
      letter-spacing: -.02em;
    }

    .intent-list { display: grid; gap: 2px; }

    .intent-row {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 10px;
      border-radius: 7px;
    }

    .intent-row:hover,
    .intent-row.selected { background: #252720; }
    .intent-row.selected .intent-mark { color: var(--accent); }
    .intent-meta { color: var(--terminal-muted); font-size: 11px; }

    .detail-box,
    .plan-box {
      margin-top: 18px;
      padding: 14px;
      color: #c8c9c1;
      background: #0f100e;
      border: 1px solid #30322c;
      border-radius: 8px;
      font-size: 11px;
      white-space: pre-wrap;
    }

    .review-title { margin: 4px 0 6px; color: #fff; font-size: 18px; }
    .review-list { display: grid; gap: 10px; margin: 22px 0; }
    .review-item { display: grid; grid-template-columns: 19px 1fr; gap: 8px; }
    .review-index { color: var(--accent); }
    .review-command { margin-top: 3px; color: var(--terminal-muted); font-size: 11px; }
    .button-row { display: flex; gap: 8px; margin-top: 22px; }

    .result-list { display: grid; gap: 9px; margin-top: 22px; }
    .result-item { display: grid; grid-template-columns: 18px 1fr; gap: 8px; }
    .result-ok { color: var(--accent); }
    .result-neutral { color: #a7a99e; }

    .prototype-switcher {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 24px;
      display: grid;
      grid-template-columns: 42px minmax(190px, auto) 42px;
      align-items: center;
      overflow: hidden;
      color: #f8f7f0;
      background: #0d0e0c;
      border: 1px solid #3b3d35;
      border-radius: 999px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .25);
      transform: translateX(-50%);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .prototype-switcher button {
      height: 42px;
      color: inherit;
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
    }

    .prototype-switcher button:hover { background: #252720; }
    .variant-label { padding: 0 16px; text-align: center; }

    @media (max-width: 780px) {
      .page { width: min(100% - 24px, 680px); padding-top: 30px; }
      .prototype-grid { grid-template-columns: 1fr; }
      .state-panel { position: static; }
      .terminal { min-height: 570px; }
      .terminal-body { padding: 21px 18px; }
      .tool-row { grid-template-columns: 20px 1fr auto; }
      .tool-row .version { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="eyebrow">PROTOTYPE / THROWAWAY / NO PRODUCTION DEPENDENCIES</div>
    <h1>少做一点，<br>但每一步更诚实。</h1>
    <p class="lede">
      问题：ai-cli-manager 在不维护安装来源矩阵的前提下，怎样让用户看清状态、选择动作，
      并把更新交回各 CLI？下面三种结构共享同一份样例状态。
    </p>

    <div class="prototype-grid">
      <section class="terminal" aria-label="CLI 原型">
        <div class="terminal-chrome">
          <span class="dots">● ● ●</span>
          <span>ai-cli-manager</span>
          <span>80 × 28</span>
        </div>
        <div class="terminal-body" id="terminalBody"></div>
      </section>

      <aside class="state-panel">
        <div class="state-title">Full prototype state</div>
        <pre id="stateOutput"></pre>
      </aside>
    </div>
  </main>

  <nav class="prototype-switcher" aria-label="原型变体切换">
    <button type="button" id="previousVariant" aria-label="上一个变体">←</button>
    <div class="variant-label" id="variantLabel"></div>
    <button type="button" id="nextVariant" aria-label="下一个变体">→</button>
  </nav>

  <script>
    const variants = [
      { key: "A", name: "全量清单" },
      { key: "B", name: "批量动作" },
      { key: "C", name: "渐进披露" },
    ];

    const tools = [
      { id: "claude", label: "Claude Code", version: "2.1.226", action: "update", command: "claude update" },
      { id: "codex", label: "Codex", version: "0.147.0", action: "update", command: "codex update" },
      { id: "kimi", label: "Kimi Code", version: "0.34.0", action: "update", command: "kimi update", interactive: true },
      { id: "pi", label: "Pi", version: "0.84.1", action: "update", command: "pi update --self" },
      { id: "omp", label: "OMP", version: null, action: "install", command: "download https://omp.sh/install → sh" },
    ];

    const urlVariant = new URLSearchParams(location.search).get("variant")?.toUpperCase();
    const state = {
      variant: variants.some((item) => item.key === urlVariant) ? urlVariant : "C",
      screen: "select",
      details: false,
      selected: new Set(["omp"]),
    };

    const terminalBody = document.getElementById("terminalBody");
    const stateOutput = document.getElementById("stateOutput");
    const variantLabel = document.getElementById("variantLabel");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function selectedTools() {
      return tools.filter((tool) => state.selected.has(tool.id));
    }

    function detailsMarkup() {
      if (!state.details) return "";
      const lines = tools.map((tool) => {
        const status = tool.version ? `v${tool.version}` : "未安装";
        const tty = tool.interactive ? "  · 继承 TTY，可能询问" : "";
        return `${tool.label.padEnd(12)} ${status.padEnd(12)} ${tool.command}${tty}`;
      });
      return `<div class="detail-box">${escapeHtml(lines.join("\n"))}</div>`;
    }

    function renderHeader(meta) {
      return `
        <div class="brand-row"><span class="brand">ai</span><span class="muted">${meta}</span></div>
        <div class="rule"></div>`;
    }

    function renderVariantA() {
      const rows = tools.map((tool) => {
        const selected = state.selected.has(tool.id);
        return `
          <button class="tool-row ${selected ? "selected" : ""}" data-tool="${tool.id}">
            <span class="check">${selected ? "●" : "○"}</span>
            <span>${tool.label}</span>
            <span class="version ${tool.version ? "" : "muted"}">${tool.version ?? "—"}</span>
            <span class="action">${tool.action === "install" ? "+ 安装" : "↻ 更新"}</span>
          </button>`;
      }).join("");

      return `${renderHeader("5 tools · local only")}
        <div class="summary-row"><span>选择要执行的动作</span><span class="muted">${state.selected.size} selected</span></div>
        <div class="section-space"></div>
        <div class="tool-list">${rows}</div>
        ${detailsMarkup()}
        <div class="rule"></div>
        <div class="footer-row">
          <span class="muted fine">click 选择 · D 详情</span>
          <button class="terminal-button" data-next ${state.selected.size ? "" : "disabled"}>继续 ↵</button>
        </div>`;
    }

    function renderVariantB() {
      const missing = tools.filter((tool) => !tool.version).map((tool) => tool.id);
      const installed = tools.filter((tool) => tool.version).map((tool) => tool.id);
      const missingSelected = missing.every((id) => state.selected.has(id));
      const installedSelected = installed.every((id) => state.selected.has(id));
      return `${renderHeader("4 installed · 1 missing")}
        <div class="variant-topline"><span class="muted">选择批量意图，不逐个管理来源</span></div>
        <div class="action-stack">
          <button class="action-card ${missingSelected ? "selected" : ""}" data-group="missing">
            <span class="action-glyph">+</span>
            <span class="action-copy"><strong>安装缺失工具</strong><span>使用唯一的推荐安装入口</span></span>
            <span class="action-count">1</span>
          </button>
          <button class="action-card ${installedSelected ? "selected" : ""}" data-group="installed">
            <span class="action-glyph">↻</span>
            <span class="action-copy"><strong>更新已安装工具</strong><span>把终端交给各 CLI updater</span></span>
            <span class="action-count">4</span>
          </button>
        </div>
        <div class="current-strip">Claude 2.1.226 · Codex 0.147.0<br>Kimi 0.34.0 · Pi 0.84.1 · OMP —</div>
        ${detailsMarkup()}
        <div class="rule"></div>
        <div class="footer-row">
          <button class="terminal-button ghost" data-details>${state.details ? "收起" : "查看命令"}</button>
          <button class="terminal-button" data-next ${state.selected.size ? "" : "disabled"}>审阅 ${state.selected.size} 项</button>
        </div>`;
    }

    function renderVariantC() {
      const installed = tools.filter((tool) => tool.version);
      const updateSelected = installed.filter((tool) => state.selected.has(tool.id)).length;
      const ompSelected = state.selected.has("omp");
      return `${renderHeader("ready")}
        <div><span class="accent">4</span> 已安装 <span class="muted">·</span> <span class="accent">1</span> 未安装</div>
        <div class="current-strip">Claude 2.1.226 · Codex 0.147.0 · Kimi 0.34.0 · Pi 0.84.1 · OMP —</div>
        <div class="question">现在要做什么？</div>
        <div class="intent-list">
          <button class="intent-row ${ompSelected ? "selected" : ""}" data-tool="omp">
            <span class="intent-mark">${ompSelected ? "●" : "○"}</span>
            <span>安装 OMP</span>
            <span class="intent-meta">recommended</span>
          </button>
          <button class="intent-row ${updateSelected === installed.length ? "selected" : ""}" data-group="installed">
            <span class="intent-mark">${updateSelected ? "●" : "○"}</span>
            <span>更新已安装工具</span>
            <span class="intent-meta">${updateSelected}/${installed.length}</span>
          </button>
          <button class="intent-row" data-details>
            <span class="intent-mark">›</span>
            <span>${state.details ? "收起精确命令" : "查看精确命令"}</span>
            <span class="intent-meta">D</span>
          </button>
        </div>
        ${detailsMarkup()}
        <div class="rule"></div>
        <div class="footer-row">
          <span class="muted fine">不查询远程版本 · 执行后复检</span>
          <button class="terminal-button" data-next ${state.selected.size ? "" : "disabled"}>继续</button>
        </div>`;
    }

    function renderReview() {
      const chosen = selectedTools();
      const items = chosen.map((tool, index) => `
        <div class="review-item">
          <span class="review-index">${index + 1}</span>
          <span>${tool.action === "install" ? "安装" : "更新"} ${tool.label}
            <div class="review-command">${escapeHtml(tool.command)}${tool.interactive ? " · 可能出现上游询问" : ""}</div>
          </span>
        </div>`).join("");
      return `${renderHeader("review")}
        <div class="review-title">确认 ${chosen.length} 个动作</div>
        <div class="muted">按顺序执行；每个动作都会继承当前终端。</div>
        <div class="review-list">${items}</div>
        <div class="plan-box">安全边界
• shell: false
• 安装脚本只允许 HTTPS 白名单与受信重定向
• 完成后重新读取版本，不把 exit 0 写成“已更新”</div>
        <div class="button-row">
          <button class="terminal-button ghost" data-back>返回</button>
          <button class="terminal-button" data-run>确认执行</button>
        </div>`;
    }

    function renderResult() {
      const resultFor = {
        claude: ["neutral", "无变化 · 2.1.226"],
        codex: ["ok", "已更新 · 0.147.0 → 0.148.0"],
        kimi: ["neutral", "无变化 · 上游未执行安装"],
        pi: ["ok", "已更新 · 0.84.1 → 0.85.0"],
        omp: ["ok", "已安装 · 0.12.4"],
      };
      const items = selectedTools().map((tool) => {
        const [tone, text] = resultFor[tool.id];
        return `<div class="result-item"><span class="result-${tone}">${tone === "ok" ? "✓" : "—"}</span><span>${tool.label}<div class="muted fine">${text}</div></span></div>`;
      }).join("");
      return `${renderHeader("done")}
        <div class="review-title">完成</div>
        <div class="muted">结果按版本变化描述，不猜测上游内部状态。</div>
        <div class="result-list">${items}</div>
        <div class="rule"></div>
        <div class="footer-row">
          <span class="muted fine">无变化不是失败，也不是“成功更新”</span>
          <button class="terminal-button ghost" data-reset>重新体验</button>
        </div>`;
    }

    function render() {
      const variant = variants.find((item) => item.key === state.variant);
      variantLabel.textContent = `${variant.key} — ${variant.name}`;
      if (state.screen === "review") terminalBody.innerHTML = renderReview();
      else if (state.screen === "result") terminalBody.innerHTML = renderResult();
      else if (state.variant === "A") terminalBody.innerHTML = renderVariantA();
      else if (state.variant === "B") terminalBody.innerHTML = renderVariantB();
      else terminalBody.innerHTML = renderVariantC();

      stateOutput.textContent = JSON.stringify({
        variant: `${variant.key} — ${variant.name}`,
        screen: state.screen,
        details: state.details,
        selected: [...state.selected],
        tools: tools.map(({ id, version, action, interactive }) => ({
          id,
          state: version ? "installed" : "missing",
          version: version ?? undefined,
          action,
          interactive: Boolean(interactive),
        })),
      }, null, 2);
    }

    function setVariant(offset) {
      const index = variants.findIndex((item) => item.key === state.variant);
      state.variant = variants[(index + offset + variants.length) % variants.length].key;
      state.screen = "select";
      const url = new URL(location.href);
      url.searchParams.set("variant", state.variant);
      history.replaceState({}, "", url);
      render();
    }

    function toggleGroup(name) {
      const group = tools.filter((tool) => name === "installed" ? tool.version : !tool.version);
      const allSelected = group.every((tool) => state.selected.has(tool.id));
      for (const tool of group) allSelected ? state.selected.delete(tool.id) : state.selected.add(tool.id);
    }

    terminalBody.addEventListener("click", (event) => {
      const target = event.target.closest("button");
      if (!target || target.disabled) return;
      if (target.dataset.tool) {
        state.selected.has(target.dataset.tool) ? state.selected.delete(target.dataset.tool) : state.selected.add(target.dataset.tool);
      } else if (target.dataset.group) {
        toggleGroup(target.dataset.group);
      } else if (target.hasAttribute("data-details")) {
        state.details = !state.details;
      } else if (target.hasAttribute("data-next")) {
        state.screen = "review";
      } else if (target.hasAttribute("data-back")) {
        state.screen = "select";
      } else if (target.hasAttribute("data-run")) {
        state.screen = "result";
      } else if (target.hasAttribute("data-reset")) {
        state.screen = "select";
      }
      render();
    });

    document.getElementById("previousVariant").addEventListener("click", () => setVariant(-1));
    document.getElementById("nextVariant").addEventListener("click", () => setVariant(1));

    document.addEventListener("keydown", (event) => {
      const editable = event.target.matches("input, textarea, [contenteditable]");
      if (!editable && event.key === "ArrowLeft") setVariant(-1);
      if (!editable && event.key === "ArrowRight") setVariant(1);
      if (!editable && event.key.toLowerCase() === "d") {
        state.details = !state.details;
        render();
      }
      if (!editable && event.key === "Escape" && state.screen !== "select") {
        state.screen = "select";
        render();
      }
      if (!editable && event.key === "Enter" && state.screen === "select" && state.selected.size) {
        state.screen = "review";
        render();
      }
    });

    render();
  </script>
</body>
</html>
